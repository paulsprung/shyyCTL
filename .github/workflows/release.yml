name: Build Windows installer

# Builds the real shyyctl-setup-<version>.exe release asset. Runs on
# windows-latest specifically because PyInstaller cannot cross-compile -
# confirmed directly in this project's own dev environment: building a
# trivial script with PyInstaller on Linux produces a Linux ELF binary,
# never a Windows PE .exe, regardless of any target-platform flag. A real
# Windows machine (or runner) is the only way to produce shyyctl.exe.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for this build (e.g. 1.0.0). Used in the installer filename and Add/Remove Programs entry."
        required: false
        default: "0.0.0-manual"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Fetch/build vendored binaries (ffmpeg, OpenRGB, SensorHelper)
        run: python tools/setup_vendor.py

      - name: Build shyyctl.exe (PyInstaller, --onedir)
        run: pyinstaller --noconfirm tools/build_installer/shyyctl.spec

      - name: Install NSIS
        shell: pwsh
        # Confirmed empirically this run: windows-latest does NOT actually
        # ship makensis preinstalled ("'makensis' is not recognized as an
        # internal or external command") - Chocolatey, which windows-latest
        # does ship, is the standard way to get it there instead.
        run: choco install nsis -y --no-progress

      - name: Build installer (NSIS)
        shell: cmd
        # Paths are relative to tools/build_installer/ (where
        # installer.nsi's own defaults assume it's run from), matching
        # this working-directory. Chocolatey's nsis package puts
        # makensis.exe on PATH itself - refreshenv isn't reliable inside
        # a single Actions step, so call it by its installed path instead
        # of trusting an inherited PATH update.
        run: |
          "%ProgramFiles(x86)%\NSIS\makensis.exe" -DVERSION=${{ steps.version.outputs.version }} -DDIST_DIR=..\..\dist\shyyctl -DVENDOR_DIR=..\..\vendor installer.nsi
        working-directory: tools/build_installer

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: shyyctl-setup-${{ steps.version.outputs.version }}
          path: tools/build_installer/shyyctl-setup-${{ steps.version.outputs.version }}.exe

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push, GITHUB_REF_NAME already is the tag - reuse it
          # exactly rather than re-deriving "v" + version, since a
          # manually-run workflow_dispatch build has no tag at all yet.
          # softprops/action-gh-release creates the tag (pointed at the
          # ref this run happened on) if it doesn't already exist, so
          # a manual "v1.0.0" build works the same as pushing that tag
          # would've - this exists specifically because this session's
          # git remote is scoped to branch pushes only and can't push
          # tags itself, so workflow_dispatch is the only way to cut a
          # release without a human pushing the tag by hand.
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          files: tools/build_installer/shyyctl-setup-${{ steps.version.outputs.version }}.exe
          generate_release_notes: true
