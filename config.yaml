# shyyctl configuration. Nothing here is guessed - every value reflects what
# was actually confirmed against the real hardware this project targets.

hub:
  # liquidctl --match string. This hub only appears as "NZXT Control Hub" -
  # do not use a bare "nzxt", the ASUS Aura LED Controller sits on the same
  # bus and a loose match becomes ambiguous.
  match: "control hub"

openrgb:
  host: "127.0.0.1"
  port: 6742
  # Confirmed this session: openrgb-python 0.3.6 (and its current GitHub
  # master) hard-caps at protocol 4 - forcing 5 makes it refuse to connect
  # at all ("Requested protocol version 5 is greater than maximum supported
  # version 4"). Leave this unset/at auto. The hub's device data still fails
  # to parse under v4 - that's a client-library limitation to work around
  # elsewhere, not something a config value fixes.
  #
  # RAM RGB (SPD/SMBus access) needs OpenRGB running as Administrator on
  # Windows or it won't detect/control the sticks - confirmed by direct
  # user report, not something OpenRGB's non-elevated mode can do. Only
  # applies when main.py auto-launches the bundled vendor/OpenRGB - if
  # you run OpenRGB yourself, launch it elevated yourself instead and
  # this setting has no effect. Triggers one UAC prompt on server
  # startup; set to false if you don't need RAM RGB and would rather
  # skip that prompt.
  launch_elevated: true

sensor_helper:
  # Same auto-launch pattern as OpenRGB above (see tools/setup_vendor.py,
  # which builds vendor/SensorHelper/SensorHelper.exe from this project's
  # own sensor-helper/Program.cs, and main.py's
  # _launch_vendor_sensor_helper()) - only used if that exe exists and
  # sensors.librehardwaremonitor_url below isn't already reachable (a
  # previous auto-launch already left it up). Elevated for the same
  # reason OpenRGB's RAM access needs it: full sensor access (CPU
  # package temperature, motherboard SuperIO chip readings) needs
  # administrator rights on Windows. Unlike the full LibreHardwareMonitor
  # GUI app this replaced, there's no separate "Remote Web Server" toggle
  # to enable by hand - SensorHelper.exe starts serving immediately on
  # launch, no manual step needed even the first time.
  launch_elevated: true

sensors:
  # Despite the name, this now points at this project's own
  # SensorHelper.exe by default (see the sensor_helper section above and
  # sensor-helper/Program.cs) rather than the full LibreHardwareMonitor
  # GUI app - kept the same URL shape/key name since SensorHelper serves
  # the identical {Text, Value, Children} JSON tree LHM's own Remote Web
  # Server does, at the same default port, so this still works unchanged
  # if you'd rather run the real LibreHardwareMonitor app yourself
  # instead (just make sure its Remote Web Server is enabled on this
  # port, and shyyctl won't auto-launch its own copy since something's
  # already answering here).
  librehardwaremonitor_url: "http://127.0.0.1:8085/data.json"
  cpu_sensor_match: "CPU Package"
  # Motherboard/RAM temperatures: opt-in and commented out by default -
  # unlike "CPU Package" (near-universal across vendors), every
  # motherboard and RAM kit names these sensors differently in the
  # LibreHardwareMonitorLib sensor tree. Check what SensorHelper (or
  # LibreHardwareMonitor's own UI) actually names your board's
  # temperature sensor (something like "Motherboard", "VRM", "Chipset",
  # "PCH" under its mainboard node) and/or your RAM's (if your kit even
  # exposes one via SPD - not all do), and uncomment + fill in the match
  # string that actually appears there. Leave commented out (or blank)
  # to just not show that tile - a wrong guess here would silently show
  # the wrong sensor's reading, which is worse than not showing one at
  # all.
  # mobo_sensor_match: "Motherboard"
  # ram_sensor_match: "Memory"
  # Confirmed this session: the Tryx Panorama's Asetek Gen8 pump is not
  # liquidctl-recognised (no second device shows up next to the Control
  # Hub). Coolant temperature is unavailable until that changes upstream -
  # curve mode falls back to CPU-only.
  pump_match: "asetek"

curve:
  default: [[30, 30], [40, 50], [60, 75], [80, 100]]
  min_duty: 20

server:
  host: "127.0.0.1"
  port: 8777
  open_browser: true

ui:
  theme: "dark"
